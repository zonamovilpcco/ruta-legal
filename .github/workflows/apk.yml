name: Crear APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Copiar la app a www
        run: |
          mkdir -p www
          cp index.html plano.html config.json manifest.webmanifest icon-192.png icon-512.png bici-marcador.png www/
          cp -r reglas www/reglas

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Permisos de ubicación y notificación
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application#' "$M"
          grep -n "uses-permission" "$M"

      - name: Icono de la app
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for n in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icon-512.png $R/mipmap-$n/ic_launcher.png
            cp $R/mipmap-$n/ic_launcher.png $R/mipmap-$n/ic_launcher_round.png
            cp $R/mipmap-$n/ic_launcher.png $R/mipmap-$n/ic_launcher_foreground.png
          done

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        run: cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ruta-legal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
